    // 3. ГЛАВНАЯ ФУНКЦИЯ-ДИСПЕТЧЕР
    function addMessage(role, content, products = null, messageType = 'text') {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${role}`;

        if (messageType === 'quiz_suggestion') {
            messageDiv.innerHTML = `
                <div class="message-content">${content.replace(/\n/g, '<br>')}</div>
                <a href="/quiz/start/" class="quiz-suggestion-btn">✨ Пройти тест стиля</a>
            `;
        } else {
            let html = `<div class="message-content">${content.replace(/\n/g, '<br>')}</div>`;
            if (products && products.length > 0) {
                html += createProductsGrid(products);
            }
            messageDiv.innerHTML = html;
        }

        messagesArea.appendChild(messageDiv);
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    async function sendMessage(message, isFirst = false) {

        console.log('sendMessage called', {isFirst, welcomeScreen: welcomeScreen?.id});

        if (!message.trim()) return;

                messagesArea.style.flexDirection = 'column';
                document.getElementById('message-input').focus();
            }, 300);

        addMessage('user', message);
        if (isFirst) {
            welcomeInput.value = '';
        } else {
            messageInput.value = '';
        }
        showTyping();

    sendBtn.addEventListener('click', () => {

    });

    messageInput.addEventListener('keypress', (e) => {

            const msg = messageInput.value.trim();
            if (msg) sendMessage(msg, false);
        }
    });

        location.reload();

    // ====================== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ================================================
    function getImageUrl(imageFilename) {
        if (!imageFilename) return null;
        if (imageFilename.startsWith('http')) return imageFilename;
        return `/media/first_images/${imageFilename}`;
    }

    function formatPrice(price) {
        return new Intl.NumberFormat('ru-RU').format(price) + ' ₽';
    }

    function createProductCard(product) {
        const imageUrl = getImageUrl(product.image_filename);
        return `
            <a href="${product.url || '#'}" class="product-card-chat" target="_blank" rel="noopener noreferrer">
                ${imageUrl ? `<img src="${imageUrl}" alt="${product.name}">` : '<div class="product-card-placeholder"></div>'}
                <span class="product-name">${product.name}</span>
                <span class="product-price">${formatPrice(product.price)}</span>
            </a>
        `;
    }

    function createProductsGrid(products) {
        if (!products || products.length === 0) return '';
        let html = '<div class="products-grid">';
        for (const p of products) html += createProductCard(p);
        html += '</div>';
        return html;
    }

    function addQuizSuggestionMessage(content, quizUrl) {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message assistant';
        messageDiv.innerHTML = `
            <div class="message-content">${content.replace(/\n/g, '<br>')}</div>
            <a href="${quizUrl}" class="quiz-suggestion-btn">✨ Пройти тест стиля</a>
        `;
        messagesArea.appendChild(messageDiv);
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }
